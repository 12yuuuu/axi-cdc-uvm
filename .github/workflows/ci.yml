#
# Checks that need no commercial simulator. The full regression runs on
# Xcelium (sim/regress.sh); its results are in docs/results.md.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install slang and Yosys (with the slang frontend)
        run: pip install pyslang==12.1.0 yowasp-yosys==0.71.0.0.post1285
      - name: Get the Accellera UVM library
        run: git clone --depth 1 --branch 2020.3.1 https://github.com/accellera-official/uvm-core.git "$RUNNER_TEMP/uvm-core"
      - name: Compile RTL + UVM testbench + SVA with slang
        run: python3 tools/lint_tb.py --uvm "$RUNNER_TEMP/uvm-core/src"
      - name: Sign-off rules (incomplete results must not sign off)
        run: python3 tools/test_report.py
      - name: Address model against hand-computed AXI vectors
        run: python3 tools/axi_addr_model.py
      - name: Shell scripts parse
        run: for f in sim/*.sh; do bash -n "$f"; done
      - name: Regression scripts against a fake simulator (exit status, plan, sign-off)
        run: bash sim/test_regress.sh
      - name: Structural CDC check (checker test designs, then the DUT in 5 configurations)
        run: |
          python3 tools/cdc_check.py --self-test
          python3 tools/cdc_check.py
